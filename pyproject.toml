# Test and lint configuration only: Launchpad_Pro95 is an Ableton Live MIDI Remote Script, not a
# Python distribution. See tests/README.md.

# Live 11+ runs Python 3.11. CI pins the tool versions (.github/workflows/tests.yml).
# Same settings as Launchpad95.
[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = [
	# "x != None" must stay: a Live object whose C++ object was deleted compares equal to
	# None, which "x is not None" does not see.
	"E711",
	# black owns the line length; what it leaves long is comments (mostly commented-out code).
	"E501",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -p no:cacheprovider"
timeout = 60
timeout_method = "thread"
filterwarnings = [
	# Decompiled Ableton framework code (fetched, not ours) compares ints with "is".
	'ignore:"is not" with a literal:SyntaxWarning',
	'ignore:"is" with a literal:SyntaxWarning',
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "scripts/*", "web/*"]

[tool.coverage.report]
show_missing = false
skip_empty = true
