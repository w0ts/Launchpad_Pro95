# Test configuration only: Launchpad_Pro95 is an Ableton Live MIDI Remote Script, not a
# Python distribution. See tests/README.md.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -p no:cacheprovider"
timeout = 60
timeout_method = "thread"
filterwarnings = [
	# Decompiled Ableton framework code (fetched, not ours) compares ints with "is".
	'ignore:"is not" with a literal:SyntaxWarning',
	'ignore:"is" with a literal:SyntaxWarning',
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "scripts/*", "web/*"]

[tool.coverage.report]
show_missing = false
skip_empty = true
